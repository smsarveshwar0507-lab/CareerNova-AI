<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Skill Assessment | CareerPath AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="logo">CareerPath AI</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="#">How It Works</a>
            <a href="career.html">Careers</a>
            <a href="#">About</a>
        </nav>

        <button class="login-btn">Get Started</button>

    </header>


    <main class="assessment-page">

        <section class="assessment-container">

            <p class="tagline">🧠 Step 2 of 4</p>

            <h1>Skill Assessment</h1>

            <p class="assessment-description">
                Let's understand your current skill level
                and identify what you need to improve.
            </p>


            <div class="career-selected">
                <span>Selected Career:</span>

                <strong id="selected-career">
                    Loading...
                </strong>
            </div>


            <div id="questions-container">

                <!-- Questions will be added using JavaScript -->

            </div>


            <button id="submit-assessment" class="continue-btn">
                Analyze My Skills →
            </button>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
