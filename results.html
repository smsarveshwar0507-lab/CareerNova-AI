<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Skill Results | CareerPath AI</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <header>

        <div class="logo">
            CareerPath AI
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="#">
                How It Works
            </a>

            <a href="career.html">
                Careers
            </a>

            <a href="#">
                About
            </a>

        </nav>

        <button class="login-btn">
            Get Started
        </button>

    </header>


    <main class="results-page">

        <section class="results-container">

            <p class="tagline">
                📊 Step 3 of 4
            </p>


            <h1>
                Your Skill Analysis
            </h1>


            <p class="results-description">
                Here's an overview of your current
                skill level for your chosen career.
            </p>


            <div class="career-result">

                <span>
                    Career:
                </span>

                <strong id="result-career">
                    Loading...
                </strong>

            </div>


            <div class="score-card">

                <p>
                    Overall Skill Score
                </p>

                <div class="score"
                     id="overall-score">

                    0%

                </div>

                <p id="skill-level">
                    Calculating...
                </p>

            </div>


            <div class="result-actions">

                <button
                    class="continue-btn"
                    id="roadmap-button">

                    View My Roadmap →

                </button>

            </div>

            <div class="skill-results-section">

    <h2>Your Skill Breakdown</h2>

    <p>
        See which skills are strong and which ones need improvement.
    </p>

    <div id="skill-results"></div>

</div>



        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
